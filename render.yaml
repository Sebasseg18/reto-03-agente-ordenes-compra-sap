services:
  - type: web
    name: reto-03-agente-sap
    runtime: node
    buildCommand: npm install && npm run typecheck
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_TOOL_ITERATIONS
        value: "25"
